name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (app code)
        run: npx eslint src/app scripts/wrc-calculator-check.mjs scripts/wrc-nozzle-fe-check.mjs scripts/wrc-nozzle-fe-shear-check.mjs scripts/bundle-size-check.mjs scripts/lafea-plate-form-check.mjs scripts/lafea-mesher-speed-check.mjs src/core/lafea-meshing/constrained-delaunay-t6.js src/core/shared-primitives/canonical-json-sha256.js scripts/wrc-pvelite-wrc297-reference-check.mjs scripts/wrc-app-status-content-check.mjs scripts/wrc-pad-check.mjs scripts/wrc-lug-check.mjs scripts/wrc-trunnion-check.mjs scripts/wrc-lug-fe-check.mjs scripts/wrc-lug-fe-route-check.mjs e2e/wrc-calculator.spec.js e2e/lafea-example.spec.js e2e/lafea-plate.spec.js e2e/app-status.spec.js
      - name: Isolation checks
        run: npm run check:boundary
      - name: Build
        run: npm run build
      - name: First-load bundle size (under 500 kB; LAFEA lazy-loaded)
        run: npm run check:bundle-size
      - name: Build single-view LAFEA entry (needed by its artifact check)
        run: npm run build:lafea
      - name: Node checks (LAFEA / EMP1 / WRC)
        run: env -u GITHUB_ACTIONS npm run check:all
        # With GITHUB_ACTIONS set, the inherited EMP1 import-firewall check also runs upstream's
        # exact-head release requalification against upstream's authority documents. That gate
        # belongs to Advanced_Analysis, and its observation script is a HELPER in known-upstream-failures.json.
        # The B01 route checks need python3, which ubuntu-latest has (they are SKIPPED where it is missing).
      - name: Upload check summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-summary
          path: reports/checks-summary.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: App browser tests (WRC calculator, LAFEA example and plate form, status page)
        run: npx playwright test e2e/wrc-calculator.spec.js e2e/lafea-example.spec.js e2e/lafea-plate.spec.js e2e/app-status.spec.js e2e/app-ui.spec.js
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
